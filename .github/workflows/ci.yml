name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/train_demo_model.py
      - run: python scripts/generate_synthetic_fundus.py --check
      - if: matrix.python-version == '3.12'
        run: git diff --exit-code -- configs/demo_model.json
      - if: matrix.python-version == '3.12'
        run: python scripts/check_public_artifacts.py
      - if: matrix.python-version == '3.12'
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - if: matrix.python-version == '3.12'
        run: python scripts/check_built_package.py dist/*.whl
      - if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/longieye-wheel-smoke"
          "$RUNNER_TEMP/longieye-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/longieye-wheel-smoke/bin/python" -c "import longieye; import longieye.fusion; import longieye.imaging; import longieye.research as research; assert longieye.__version__ == '0.4.0'; assert hasattr(research, 'ResearchModelAdapter'); assert not hasattr(research, 'TorchStateDictRuntime')"
      - run: python -m pytest -q
      - if: matrix.python-version == '3.12'
        run: python scripts/benchmark_service.py --warmup 5 --core-iterations 1000 --api-iterations 100 --memory-iterations 20
      - if: matrix.python-version == '3.12'
        run: python scripts/benchmark_multimodal.py --warmup 2 --iterations 20 --output-dir "$RUNNER_TEMP/multimodal-benchmark"

  artifact-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/train_demo_model.py
      - run: git diff --exit-code -- configs/demo_model.json
      - run: python scripts/generate_synthetic_fundus.py --check

  research-adapter:
    runs-on: ubuntu-latest
    env:
      LONGIEYE_REQUIRE_TORCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.research.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements.research.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -c "import torch; assert torch.__version__.split('+', 1)[0] == '2.13.0'; assert torch.tensor([1.0]).device.type == 'cpu'"
      - run: python scripts/validate_research_manifest.py
      - run: python -m pytest -q tests/test_model_contract.py tests/test_research_adapter.py tests/test_comparison.py
